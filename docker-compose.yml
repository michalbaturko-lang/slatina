version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: slatina-postgres
    environment:
      POSTGRES_USER: slatina
      POSTGRES_PASSWORD: slatina_dev
      POSTGRES_DB: slatina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slatina"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: slatina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for local dev)
  minio:
    image: minio/minio:latest
    container_name: slatina-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO setup (create buckets)
  minio-setup:
    image: minio/mc:latest
    container_name: slatina-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/slatina-videos-dev;
      mc mb --ignore-existing local/slatina-videos-dev-processed;
      mc anonymous set download local/slatina-videos-dev-processed;
      exit 0;
      "

  # Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: slatina-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://slatina:slatina_dev@postgres:5432/slatina
      REDIS_URL: redis://redis:6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slatina-videos-dev
      S3_BUCKET_PROCESSED: slatina-videos-dev-processed
      JWT_SECRET: dev-jwt-secret-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: npm run dev

  # Frontend Web App
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: slatina-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./packages:/packages
    depends_on:
      - api
    command: npm run dev

  # AI Analyzer (Python)
  ai-analyzer:
    build:
      context: ./services/ai-analyzer
      dockerfile: Dockerfile
    container_name: slatina-ai-analyzer
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slatina-videos-dev
      DATABASE_URL: postgresql://slatina:slatina_dev@postgres:5432/slatina
      MODEL_PATH: /models
    volumes:
      - ./services/ai-analyzer/src:/app/src
      - ai_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # FFmpeg video processor (for clip export)
  video-processor:
    build:
      context: ./services/video-processor
      dockerfile: Dockerfile
    container_name: slatina-video-processor
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slatina-videos-dev
      S3_BUCKET_PROCESSED: slatina-videos-dev-processed
    volumes:
      - ./services/video-processor/src:/app/src
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ai_models:

networks:
  default:
    name: slatina-network
