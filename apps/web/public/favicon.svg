<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="20"/>

  <!-- Diagonal stripes -->
  <g opacity="0.3">
    <line x1="0" y1="60" x2="60" y2="0" stroke="white" stroke-width="8"/>
    <line x1="0" y1="140" x2="140" y2="0" stroke="white" stroke-width="8"/>
    <line x1="60" y1="200" x2="200" y2="60" stroke="white" stroke-width="8"/>
    <line x1="140" y1="200" x2="200" y2="140" stroke="white" stroke-width="8"/>
  </g>

  <!-- SLATINA text -->
  <text x="100" y="75" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="white" stroke="#1e293b" stroke-width="3" transform="rotate(-8, 100, 75)">SLATINA</text>

  <!-- Soccer ball -->
  <g transform="translate(100, 135)">
    <circle cx="0" cy="0" r="40" fill="white" stroke="#1e293b" stroke-width="2"/>
    <!-- Pentagon pattern -->
    <polygon points="0,-15 14,-5 9,12 -9,12 -14,-5" fill="#1e293b"/>
    <polygon points="0,-40 8,-28 -8,-28" fill="#1e293b"/>
    <polygon points="35,-12 28,3 38,8" fill="#1e293b"/>
    <polygon points="-35,-12 -28,3 -38,8" fill="#1e293b"/>
    <polygon points="22,32 10,25 15,38" fill="#1e293b"/>
    <polygon points="-22,32 -10,25 -15,38" fill="#1e293b"/>
  </g>
</svg>