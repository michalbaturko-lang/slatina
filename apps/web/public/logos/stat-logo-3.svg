<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M100 10 L180 40 L180 120 Q180 180 100 220 Q20 180 20 120 L20 40 Z" fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="4"/>

  <!-- Inner shield border -->
  <path d="M100 25 L165 50 L165 115 Q165 165 100 200 Q35 165 35 115 L35 50 Z" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Football field lines -->
  <ellipse cx="100" cy="100" rx="50" ry="35" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="65" x2="100" y2="135" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- STAT vertical arrangement -->
  <text x="100" y="85" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">STAT</text>

  <!-- Stars -->
  <polygon points="60,145 63,155 55,149 65,149 57,155" fill="url(#goldGrad)"/>
  <polygon points="100,140 104,152 94,145 106,145 96,152" fill="url(#goldGrad)"/>
  <polygon points="140,145 143,155 135,149 145,149 137,155" fill="url(#goldGrad)"/>

  <!-- SK Slatina text -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">SK SLATINA</text>
  <text x="100" y="192" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" letter-spacing="1">2017</text>
</svg>
